name: release

on:
  # Build on every branch/tag push and on pull requests so feature branches
  # (e.g. changes to be sent upstream as PRs) get built too. Only master and
  # version tags publish a release; feature branches just produce artifacts.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-mod:
    runs-on: ubuntu-22.04
    name: Build mod and ewext
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnu
          toolchain: 'nightly'
      - name: Install extra deps
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ewext -> target

      - name: Build ewext
        run: |
          rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
          cargo +nightly build --release --target=i686-pc-windows-gnu
        working-directory: ./ewext
      - name: Copy ewext
        run: cp ewext/target/i686-pc-windows-gnu/release/ewext.dll quant.ew/ewext.dll

      - name: Create archive
        run: python scripts/ci_make_archives.py mod

      - uses: actions/upload-artifact@v4
        with:
          name: quant.ew.zip
          path: target/quant.ew.zip

  build-proxy-linux:
    name: Build proxy for linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install extra deps
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev gcc-mingw-w64-i686 gcc-mingw-w64 libasound2-dev libjack-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: noita_proxy -> target

      - name: Build Linux proxy release
        run: cargo build --release
        working-directory: ./noita_proxy
      
      - name: Create archives
        run: python scripts/ci_make_archives.py linux

      - uses: actions/upload-artifact@v4
        with:
          name: noita_proxy-linux.zip
          path: target/noita_proxy-linux.zip

  build-proxy-macos:
    name: Build proxy for macos (${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            architecture: arm64
            zip_name: noita_proxy-macos-arm64.zip
          - os: macos-15-intel
            architecture: intel
            zip_name: noita_proxy-macos-intel.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: noita_proxy -> target

      - name: Build Macos proxy release
        run: export CMAKE_POLICY_VERSION_MINIMUM=3.5 && cargo build --release
        working-directory: ./noita_proxy

      - name: Create archives
        run: python scripts/ci_make_archives.py macos

      - name: Rename archive
        run: mv target/noita_proxy-macos.zip target/${{ matrix.zip_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: target/${{ matrix.zip_name }}

  build-proxy-windows:
    name: Build proxy for windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: noita_proxy -> target

      - name: Build Windows proxy release
        run: cargo build --release
        working-directory: ./noita_proxy

      - name: Create archives
        run: python scripts/ci_make_archives.py windows

      - uses: actions/upload-artifact@v4
        with:
          name: noita_proxy-win.zip
          path: target/noita_proxy-win.zip

  release:
    name: Release
    # Publish automatically on pushes to the default branch (master) with the
    # version from noita_proxy/Cargo.toml, and on explicit v* tags. Feature
    # branches and pull requests only build, they never publish a release.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs: [build-mod, build-proxy-linux, build-proxy-windows, build-proxy-macos]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed to build the changelog below.
          fetch-depth: 0
      - name: Determine release tag
        id: version
        run: |
          version=$(grep -m1 '^version' noita_proxy/Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "Could not determine proxy version from noita_proxy/Cargo.toml" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing as v$version"
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Base the notes on the last published build, so the summary
          # describes what actually changed since then (either the previous
          # version, or the previous build of the same version). Only the
          # newest release is kept, so the latest release is always that base.
          prev_sha=$(gh release view --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ -n "$prev_sha" ] && ! git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            prev_sha=""
          fi
          if [ -n "$prev_sha" ]; then
            range="$prev_sha..HEAD"
          else
            range="HEAD"
          fi

          # Commit subjects grouped by their author so the people who did the
          # work are credited. Merge commits and automated version bumps are
          # left out.
          commits=$(git log --no-merges --reverse \
            --invert-grep --grep='^Automated commit' \
            --pretty=format:'%an%x09%s%x09%h' "$range")

          if [ -z "$commits" ]; then
            echo "Maintenance build, no user-facing changes since the previous release." > release_notes.md
          else
            {
              echo "## What's Changed"
              echo
              echo "$commits" | awk -F'\t' -v repo="$REPO" '
                {
                  author=$1; subject=$2; sha=$3
                  if (author != current) {
                    if (current != "") print ""
                    printf "### %s\n", author
                    current=author
                  }
                  printf "- %s ([%s](https://github.com/%s/commit/%s))\n", subject, sha, repo, sha
                }'
              echo
              if [ -n "$prev_sha" ]; then
                echo "**Full Changelog**: https://github.com/$REPO/compare/$prev_sha...$GITHUB_SHA"
                echo
              fi
            } > release_notes.md
          fi

          cat >> release_notes.md <<'NOTES'
          ## Installation

          Download and unpack `noita_proxy-win.zip` or `noita_proxy-linux.zip`, depending on your OS. After that, launch the proxy.

          Proxy is able to download and install the mod automatically. There is no need to download the mod (`quant.ew.zip`) manually.

          You'll be prompted for a path to `noita.exe` when launching the proxy for the first time. It should be detected automatically as long as you use steam version of the game and steam is launched.

          ## Updating

          There is a button in bottom-left corner on noita_proxy's main screen that allows to auto-update to a new version when one is available.
          NOTES

          echo "----- release notes -----"
          cat release_notes.md
      - name: Delete all older releases to save space
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Only the newest release is kept. Releases are keyed by the proxy
          # version, so when the version is bumped the previous release (and
          # its tag) is removed here before publishing the new one.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$KEEP_TAG" ]; then
              echo "Deleting old release $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: "*.zip"
          make_latest: true
          fail_on_unmatched_files: true
